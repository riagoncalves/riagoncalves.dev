backend:
  name: git-gateway
  branch: master

local_backend: true

media_folder: "public/images/blog"
public_folder: "/images/blog"

publish_mode: simple

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "content/posts"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "[{{lang}}] {{title}} — {{date}} {{draft}}"
    sortable_fields: ["date", "title"]
    view_filters:
      - { label: "English", field: "lang", pattern: "en" }
      - { label: "Português", field: "lang", pattern: "pt" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Language"
        name: "lang"
        widget: "select"
        default: "en"
        options:
          - { label: "English", value: "en" }
          - { label: "Português (PT)", value: "pt" }
        hint: "English posts are listed on /blog, Portuguese posts on /pt/blog."
      - label: "Translation of"
        name: "translation"
        widget: "relation"
        collection: "posts"
        value_field: "{{slug}}"
        search_fields: ["title"]
        display_fields: ["[{{lang}}] {{title}}"]
        required: false
        hint: "Optional. If this post is a translation, pick the original post in the other language. Linking one side is enough: both posts will show a link to each other and the language switcher will jump between them."
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Description", name: "description", widget: "text", hint: "Shown in the blog list and as the page's meta description." }
      - { label: "Draft", name: "draft", widget: "boolean", default: true, hint: "Keep this on while you're still writing. Turn it off to publish the post." }
      - { label: "Tags", name: "tags", widget: "list", default: [], required: false }
      - { label: "Cover Image", name: "cover", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
