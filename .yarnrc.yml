approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

# @next/eslint-plugin-next uses @eslint-community/eslint-utils, which needs eslint
# as a peer, but doesn't declare it itself. Silences YN0086 on install.
packageExtensions:
  "@next/eslint-plugin-next@*":
    peerDependencies:
      eslint: "*"
